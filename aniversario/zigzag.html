<html>
  <head>
     <style>
      @import url("https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&family=Isometra&family=Solitreo&display=swap");
      *{
        padding:0;
        margin:0 auto;
        box-sizing: border-box;
      }
      body{
        background-color: #000;
        color: #fff;
        min-height:100vh ;
        display: grid;
        place-items: center;
        overflow: hidden;
        perspective: 450px;

      }
      .zigzag{
        position: relative;
        transform-style: preserve-3d;
        animation: zigzag 16s infinite linear;
        i{
            --color:hsl(200 100% calc(var(--i)
             * 5% + 20%));
             position:absolute ;
             font-family: "Prompt", sans-serif;
             font-weight: 900;
             font-size: 70px;
             background-image:linear-gradient(45deg,transparent 30%,var(--color) 0 36%, transparent 0),
             linear-gradient(-45deg,transparent 30%,var(--color) 0 36%, transparent 0) ;
             background-size: 16px 8px;
             background-clip: text;
             -webkit-background-clip:text ;
             text-align: center;
             color: transparent;
             transform: translate3D(50%,50%,calc(var(--i)* 1px));
        }
      }
      @keyframes zigzag{
        from{
            transform: rotate(0deg) rotateX(30deg) rotate(360deg);
        }
        to{
            transform: rotate(360deg) rotateX(30deg) rotate(0deg);
        }
      }
     </style>
  </head>
  <body>
    <div class="zigzag">
        <i style="--i:0">Feliz Aniversario</i>
        <i style="--i:1">Feliz Aniversario</i>
        <i style="--i:2">Feliz Aniversario</i>
        <i style="--i:3">Feliz Aniversario</i>
        <i style="--i:4">Feliz Aniversario</i>
        <i style="--i:5">Feliz Aniversario</i>
        <i style="--i:6">Feliz Aniversario</i>
        <i style="--i:7">Feliz Aniversario</i>
        <i style="--i:8">Feliz Aniversario</i>
        <i style="--i:9">Feliz Aniversario</i>
        <i style="--i:10">Feliz Aniversario</i>
        <i style="--i:11">Feliz Aniversario</i>
        <i style="--i:12">Feliz Aniversario</i>
        <i style="--i:13">Feliz Aniversario</i>
        <i style="--i:14">Feliz Aniversario</i>
        <i style="--i:15">Feliz Aniversario</i>
    </div>
  </body>
</html>
