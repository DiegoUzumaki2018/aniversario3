<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eu Te Amo ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }


        #mensagem {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            color: white;

            font-size: clamp(35px, 8vw, 100px);

            font-weight: bold;

            text-align: center;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            text-shadow:
                0 0 10px #ff0055,
                0 0 25px #ff0055,
                0 0 50px #ff0055;

            transition:
                opacity 1s ease,
                transform 1.2s cubic-bezier(.17,.67,.31,1.3);

            z-index: 10;
        }


     

        #mensagem.mostrar {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);

        }

    </style>

</head>


<body>


<div id="mensagem">
    EU TE AMO ❤️
</div>


<script type="module">

    import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


    

    const scene = new THREE.Scene();




    const camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

    camera.position.z = 15;


 

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


 

    const quantidade = 30000;


    const geometria =
        new THREE.BufferGeometry();


    const posicoes =
        new Float32Array(
            quantidade * 3
        );


    const cores =
        new Float32Array(
            quantidade * 3
        );




    const velocidades = [];


 

    for (
        let i = 0;
        i < quantidade;
        i++
    ) {

        const i3 = i * 3;


      

        const raio =
            Math.random() * 9;


        const angulo =
            Math.random() *
            Math.PI * 2;


       

        posicoes[i3] =
            Math.cos(angulo) *
            raio;


       

        posicoes[i3 + 1] =
            Math.sin(angulo) *
            raio *
            0.45;


      

        posicoes[i3 + 2] =
            (Math.random() - 0.5) * 6;


    

        cores[i3] =
            1;

        cores[i3 + 1] =
            Math.random() * 0.35;

        cores[i3 + 2] =
            Math.random() * 0.45;


       

        velocidades.push({

            x: 0,
            y: 0,
            z: 0

        });

    }


    geometria.setAttribute(
        "position",

        new THREE.BufferAttribute(
            posicoes,
            3
        )
    );


    geometria.setAttribute(
        "color",

        new THREE.BufferAttribute(
            cores,
            3
        )
    );



    const material =
        new THREE.PointsMaterial({

            size: 0.06,

            sizeAttenuation: true,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            vertexColors: true

        });




    const pontos =
        new THREE.Points(
            geometria,
            material
        );


    scene.add(pontos);


 

    const raycaster =
        new THREE.Raycaster();


    const mouse =
        new THREE.Vector2();


    raycaster.params.Points.threshold =
        0.15;



    let explodiu = false;


   

    window.addEventListener(
        "click",

        function(event) {


            if (explodiu)
                return;


           

            mouse.x =
                (event.clientX /
                    window.innerWidth) * 2 - 1;


            mouse.y =
                -(event.clientY /
                    window.innerHeight) * 2 + 1;


            // verifica as partículas

            raycaster.setFromCamera(
                mouse,
                camera
            );


            const intersecoes =
                raycaster.intersectObject(
                    pontos
                );



            if (intersecoes.length > 0) {

                explodir();

            }

        }
    );


    

    function explodir() {

        explodiu = true;


        

        for (
            let i = 0;
            i < quantidade;
            i++
        ) {

            const velocidade =
                velocidades[i];


           

            velocidade.x =
                (Math.random() - 0.5)
                * 0.08;


            velocidade.y =
                (Math.random() - 0.5)
                * 0.08;


            velocidade.z =
                (Math.random() - 0.5)
                * 0.08;

        }


      
        setTimeout(
            function() {

                document
                    .getElementById(
                        "mensagem"
                    )
                    .classList.add(
                        "mostrar"
                    );

            },
            700
        );

    }


  
    function animar() {

        requestAnimationFrame(
            animar
        );


        const posicoes =
            geometria.attributes.position.array;


       

        if (!explodiu) {

            pontos.rotation.y +=
                0.0015;

            pontos.rotation.z +=
                0.0004;

        }



        else {

            for (
                let i = 0;
                i < quantidade;
                i++
            ) {

                const i3 = i * 3;


                posicoes[i3] +=
                    velocidades[i].x;


                posicoes[i3 + 1] +=
                    velocidades[i].y;


                posicoes[i3 + 2] +=
                    velocidades[i].z;

            }


            geometria.attributes
                .position
                .needsUpdate = true;

        }


        renderer.render(
            scene,
            camera
        );

    }


    animar();



    window.addEventListener(
        "resize",

        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>

</html>
