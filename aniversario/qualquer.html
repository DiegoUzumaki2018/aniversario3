<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          body {
            margin: 0;
            height: 100vh;
            background: #050018;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #botao {
            padding: 20px 40px;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: #ff1493;
            color: white;
        }

        #parabens {
            position: absolute;

            font-size: 100px;
            font-weight: bold;
            color: white;

            opacity: 0;
            transform: scale(0);

            pointer-events: none;
        }

        
        #parabens.mostrar {
            animation: aparecer 1.5s forwards;
        }

        @keyframes aparecer {
            0% {
                opacity: 0;
                transform: scale(0);
            }

            60% {
                opacity: 1;
                transform: scale(1.3);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

       
        .fogo {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;

            animation: explosao 1.5s forwards;
        }

        @keyframes explosao {
            0% {
                transform: translate(0, 0);
                opacity: 1;
                box-shadow: 0 0 5px white;
            }

            100% {
                transform:
                    translate(var(--x), var(--y));
                opacity: 0;
            }
        }
        a{
            margin-top: 500px;
        }
    </style>
</head>
<body>
       <button id="botao">
        🎁 CLIQUE AQUI!
    </button>

    <div id="parabens">
        🎉 PARABÉNS! 🎉
    </div>
<script src="seila.js"></script>
<a href="index.html">Voltar</a>
</body>
</html>
